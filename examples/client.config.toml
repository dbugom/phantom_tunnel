# Phantom Tunnel Client Configuration
# Copy to ~/.config/phantom_tunnel/config.toml

[client]
# Server address
# Format: hostname:port or IP:port
server = "your-server.example.com:443"

# Server's public key (base64 encoded)
# Obtain from server administrator
server_public_key = ""

# Client's private key (base64 encoded)
# Leave empty on first run - will auto-generate and save
# Or generate with: phantom-client --generate-key
private_key = ""

# Client's public key (base64 encoded)
# Auto-generated with private_key - share this with server admin
public_key = ""

# Local SOCKS5 proxy address
# Applications connect here to use the tunnel
# Set to empty string to disable SOCKS5
socks5_listen = "127.0.0.1:1080"

# Local HTTP CONNECT proxy address
# For applications that don't support SOCKS5
# Set to empty string to disable HTTP proxy
http_listen = "127.0.0.1:8080"

# Backup servers, tried in order when `server` can't be reached or refuses
# this client. "host:port" alone uses server_public_key; give a public_key for
# a server with a different key.
# backup_servers = [
#     "203.0.113.10:443",
#     { address = "backup.example.net:443", public_key = "BACKUP_SERVER_PUBLIC_KEY" },
# ]

# Camouflage: carry the tunnel inside a real TLS + WebSocket session so it looks
# like ordinary HTTPS to your domain (requires a reverse proxy such as Caddy in
# front of the server; see docs/CAMOUFLAGE.md). Omit this section for plain TCP.
# [client.transport]
# type = "wss"              # "plain" (default), "wss" (TLS+WebSocket), or "ws"
# path = "/relay"           # the secret path your reverse proxy routes to the tunnel
# sni  = "vpn.example.com"  # TLS server name; defaults to the host of `server`
# host = "vpn.example.com"  # HTTP Host header; defaults to sni

[logging]
# Log level: trace, debug, info, warn, error
level = "info"

# Log format: pretty, json, compact
format = "pretty"

# Log file (optional)
# Omit to log to stdout
# file = "~/.local/share/phantom_tunnel/client.log"
