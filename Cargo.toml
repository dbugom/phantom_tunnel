[package]
name = "phantom_tunnel"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A secure, censorship-resistant tunneling protocol"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/phantom_tunnel"
keywords = ["tunnel", "proxy", "privacy", "censorship", "encryption"]
categories = ["network-programming", "cryptography"]

[[bin]]
name = "phantom-server"
path = "src/bin/server.rs"

[[bin]]
name = "phantom-client"
path = "src/bin/client.rs"

[dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Noise Protocol: handshake and transport encryption
snow = "0.9"

# Secure random bytes (frame padding)
ring = "0.17"

# Configuration
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Utilities
bytes = "1.9"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
base64 = "0.22"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.15"

[[bench]]
name = "tunnel_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
