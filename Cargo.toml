[package]
name = "phantom_tunnel"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A secure, censorship-resistant tunneling protocol"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/phantom_tunnel"
keywords = ["tunnel", "proxy", "privacy", "censorship", "encryption"]
categories = ["network-programming", "cryptography"]

[[bin]]
name = "phantom-server"
path = "src/bin/server.rs"

[[bin]]
name = "phantom-client"
path = "src/bin/client.rs"

[dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Noise Protocol: handshake and transport encryption
snow = "0.9"

# Secure random bytes (frame padding)
ring = "0.17"

# Configuration
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Utilities
bytes = "1.9"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
async-tungstenite = { version = "0.28", default-features = false, features = ["tokio-runtime", "futures-03-sink"] }
ws_stream_tungstenite = { version = "0.14", default-features = false, features = ["tokio_io"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tempfile = "3.15"

[[bench]]
name = "tunnel_bench"
harness = false

# Optimise dependencies (snow / ChaCha20-Poly1305) even in debug and test
# builds. Unoptimised crypto is slow enough to dominate the throughput tests.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
